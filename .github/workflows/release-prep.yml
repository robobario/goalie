name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate version format
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || \
            { echo "version must be X.Y.Z"; exit 1; }

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Stamp VERSION
        run: echo "${{ inputs.version }}" > VERSION

      - name: Build linux binary for system tests
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ inputs.version }}" \
            -o dist/goalie-linux-amd64 ./cmd/goalie

      - name: System tests against release binary
        run: GOALIE_BINARY=dist/goalie-linux-amd64 go test ./tests/system/...

      - name: Commit and tag release
        run: |
          git add VERSION
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"

      - name: Bump to dev version
        run: |
          PATCH=$(echo "${{ inputs.version }}" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          PREFIX=$(echo "${{ inputs.version }}" | cut -d. -f1-2)
          DEV_VERSION="${PREFIX}.${NEXT_PATCH}-dev"
          echo "${DEV_VERSION}" > VERSION
          git add VERSION
          git commit -m "chore: begin development of v${DEV_VERSION}"

      - name: Push
        run: git push origin main "v${{ inputs.version }}"

      - name: Next step
        run: |
          echo "Tag v${{ inputs.version }} pushed — release workflow triggered."
          echo ""
          echo "If the release workflow fails, delete and re-push the tag to retry:"
          echo ""
          echo "  git push --delete origin v${{ inputs.version }}"
          echo "  git tag -d v${{ inputs.version }}"
          echo "  git fetch origin"
          echo "  git tag v${{ inputs.version }} origin/main"
          echo "  git push origin v${{ inputs.version }}"
