name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.3)'
        required: true
      bump_to_dev:
        description: 'Bump to next dev version after release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || \
            { echo "version must be X.Y.Z"; exit 1; }

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Stamp VERSION
        run: echo "${{ inputs.version }}" > VERSION

      - name: Build linux binary for system tests
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ inputs.version }}" \
            -o dist/goalie-linux-amd64 ./cmd/goalie

      - name: System tests against release binary
        run: GOALIE_BINARY=dist/goalie-linux-amd64 go test ./tests/system/...

      - name: Commit version bump
        run: |
          git add VERSION
          git commit -m "chore: release v${{ inputs.version }}"

      - name: Tag release
        run: git tag "v${{ inputs.version }}"

      - name: Push commit and tag
        run: git push origin main "v${{ inputs.version }}"

      - name: Build, sign, and publish release
        # Signing secrets are optional — notarization is skipped if MACOS_SIGN_P12 is unset.
        # Required secrets for macOS signing:
        #   MACOS_SIGN_P12           - base64-encoded Developer ID Application .p12 certificate
        #   MACOS_SIGN_PASSWORD      - password for the .p12
        #   MACOS_NOTARY_ISSUER_ID   - App Store Connect API issuer UUID
        #   MACOS_NOTARY_KEY_ID      - App Store Connect API key ID
        #   MACOS_NOTARY_KEY         - base64-encoded App Store Connect API .p8 private key
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -w /src \
            -e GITHUB_TOKEN \
            -e MACOS_SIGN_P12 \
            -e MACOS_SIGN_PASSWORD \
            -e MACOS_NOTARY_ISSUER_ID \
            -e MACOS_NOTARY_KEY_ID \
            -e MACOS_NOTARY_KEY \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/src \
            docker.io/goreleaser/goreleaser:v2.17.1@sha256:ad46dcae6d92cf1f39ef12e7a9aa7dcb094ac1da26d972d45da4cbfe69f341d2 \
            release --clean

      - name: Bump to dev version
        if: inputs.bump_to_dev
        run: |
          PATCH=$(echo "${{ inputs.version }}" | cut -d. -f3)
          NEXT_PATCH=$((PATCH + 1))
          PREFIX=$(echo "${{ inputs.version }}" | cut -d. -f1-2)
          DEV_VERSION="${PREFIX}.${NEXT_PATCH}-dev"
          echo "${DEV_VERSION}" > VERSION
          git add VERSION
          git commit -m "chore: begin development of v${DEV_VERSION}"
          git push origin main
